name: prostate-flip

x-image: &experiment-image
  image: prostate-flip-clinical:latest

x-client-environment: &client-environment
  SERVER_ADDRESS: server:8080
  SEED: "1234"
  REPETITION: ${REPETITION:-1}
  CLIENT_DATA_PATH: /app/data/client.npz

x-client: &client
  <<: *experiment-image
  command: ["sh", "-c", "sleep 5 && python /app/client.py"]
  depends_on:
    - server
  restart: on-failure:3
  mem_limit: 512m
  networks:
    - flwr_network
  labels:
    experiment: prostate-cancer-real-world
    role: flower-client

services:
  server:
    <<: *experiment-image
    build:
      context: ../..
      dockerfile: experiments/prostate_cancer_real_world/docker/Dockerfile
    command: ["python", "/app/server.py"]
    environment:
      METHOD: ${METHOD:-fliponline}
      NETWORK_CONDITION: ${NETWORK_CONDITION:-unstable}
      REPETITION: ${REPETITION:-1}
      RESULTS_ROOT: /app/results
      ROUNDS: ${ROUNDS:-20}
      RUN_ID: ${RUN_ID:-manual}
    ports:
      - "18080:8080"
    volumes:
      - ./docker_results:/app/results
      - ../../Docker:/app/Docker:ro
    networks:
      - flwr_network
    labels:
      experiment: prostate-cancer-real-world
      role: flower-server

  client-es:
    <<: *client
    container_name: prostate-client-es
    cpus: 2.0
    environment:
      <<: *client-environment
      CLIENT_ID: "1"
      SILO: Spain
      CLIENT_CODE: es
      CPU_LIMIT: "2"
    volumes:
      - ./data/clients/es.npz:/app/data/client.npz:ro

  client-kr:
